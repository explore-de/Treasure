version: 2
updates:
  # Maven dependencies - treasure-app
  - package-ecosystem: "maven"
    directory: "/app.treasure.treasure-app"
    schedule:
      interval: "daily"
    groups:
      maven-dependencies:
        patterns:
          - "*"

  # Docker base images - treasure-app
  - package-ecosystem: "docker"
    directory: "/app.treasure.treasure-app/src/main/docker"
    schedule:
      interval: "daily"
    groups:
      docker-images:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
