{#include main.html}
{#title}New device{/title}

<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="/devices">Devices</a>
  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
  <span aria-current="page">New device</span>
</nav>

<div class="page-head">
  <div>
    <h1>New device</h1>
    <p class="page-meta">Only the name is required. Everything else can be added later.</p>
  </div>
</div>

<form method="post" action="/devices/create" class="form-card">
  {#authenticityToken /}
  {#deviceFormFields device=device groups=groups /}
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      Save device
    </button>
    <a href="/devices" class="btn btn-secondary">Cancel</a>
    <span class="hint">* required</span>
  </div>
</form>

{/include}
