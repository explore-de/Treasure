<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          window.__theme = t;
          if (t === 'dark') document.documentElement.classList.add('cds--g100');
        } catch (e) {}
        // Side nav: decide expanded/collapsed now, so the content never jumps after paint.
        window.__navExpanded = window.innerWidth >= 1550;
        if (window.__navExpanded) document.documentElement.classList.add('side-nav-expanded');
      })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff8200">
    <title>{#insert title/} · Treasure</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" id="theme-light" href="/css/carbon-styles.min.css">
    <link rel="stylesheet" href="/css/treasure-core.css?v=21">
    <link rel="stylesheet" href="/css/treasure-pages.css?v=21">
    <style>
      cds-header:not(:defined) {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        background-color: var(--cds-background, #ffffff);
        border-bottom: 1px solid var(--cds-border-subtle, #e0e0e0);
        z-index: 8000;
      }
      html.cds--g100 cds-header:not(:defined) {
        background-color: #161616;
        border-bottom-color: #393939;
      }
      cds-side-nav:not(:defined) {
        display: block;
        position: fixed;
        top: 48px;
        left: 0;
        width: 48px;
        height: calc(100vh - 48px);
        background-color: var(--cds-background, #ffffff);
        border-right: 1px solid var(--cds-border-subtle, #e0e0e0);
        z-index: 7000;
      }
      html.cds--g100 cds-side-nav:not(:defined) {
        background-color: #161616;
        border-right-color: #393939;
      }
      cds-header:not(:defined) > *,
      cds-side-nav:not(:defined) > * {
        visibility: hidden;
      }
    </style>
    <!-- Carbon web components 2.65.0 (matches the vendored @carbon/styles 1.117.0): only the ones this app renders -->
    <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/version/v2.65.0/ui-shell.min.js"></script>
    <script type="module" src="https://1.www.s81c.com/common/carbon/web-components/version/v2.65.0/notification.min.js"></script>

    <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"></script>
    <script src="/js/devices.js?v=20" defer></script>

    {#insert moreStyles /}
    {#insert moreScripts /}
  </head>
  <body>
    <script>
      if (window.__theme === 'dark') document.body.classList.add('cds--g100');
    </script>
    {#include tags/header.html /}

    <cds-side-nav aria-label="Main navigation" collapse-mode="fixed">
      <cds-side-nav-items style="background-color: var(--white)">
        <cds-side-nav-link href="/" {#if inject:vertxRequest.path == '/'}active{/if}>
          Overview
          <svg slot="title-icon" viewBox="0 0 32 32" width="20" height="20"><path d="M4 4h10v12H4zm14 0h10v8H18zM4 18h10v10H4zm14-4h10v14H18zM6 6v8h6V6zm14 0v4h6V6zM6 20v6h6v-6zm14-4v10h6V16z" fill="var(--text)"/></svg>
        </cds-side-nav-link>
        <cds-side-nav-link href="/devices" {#if inject:vertxRequest.path.startsWith('/devices')}active{/if}>
          Devices
          <svg slot="title-icon" viewBox="0 0 32 32" width="20" height="20"><path d="M28 5H4a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h24a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 20H4V7h24ZM9 10h14v2H9zm0 5h14v2H9zm0 5h14v2H9z" fill="var(--text)"/></svg>
        </cds-side-nav-link>
        <cds-side-nav-link href="/members" {#if inject:vertxRequest.path.startsWith('/members')}active{/if}>
          Members
          <svg slot="title-icon" viewBox="0 0 32 32" width="20" height="20"><path d="M16 4a5 5 0 1 1-5 5 5 5 0 0 1 5-5m0-2a7 7 0 1 0 7 7 7 7 0 0 0-7-7ZM26 30h-2v-5a5 5 0 0 0-5-5h-6a5 5 0 0 0-5 5v5H6v-5a7 7 0 0 1 7-7h6a7 7 0 0 1 7 7Z" fill="var(--text)"/></svg>
        </cds-side-nav-link>
      </cds-side-nav-items>
    </cds-side-nav>
    <script>
      // Runs before the ui-shell module upgrades the element, so it renders expanded right away.
      if (window.__navExpanded) document.querySelector('cds-side-nav').setAttribute('expanded', '');
    </script>

    <div class="app-container">
      {#include tags/flashNotifications.html /}
      <main class="content">
        {#insert /}
      </main>
    </div>

    <script>
      function toggleSideNav() {
        var sideNav = document.querySelector('cds-side-nav');
        if (sideNav) {
          sideNav.expanded = !sideNav.expanded;
        }
      }

      var THEME_ICON_DARK = '<path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M21.7519 15.0021C20.597 15.484 19.3296 15.7501 18 15.7501C12.6152 15.7501 8.25 11.3849 8.25 6.00011C8.25 4.67052 8.51614 3.40308 8.99806 2.24817C5.47566 3.71798 3 7.19493 3 11.2501C3 16.6349 7.36522 21.0001 12.75 21.0001C16.8052 21.0001 20.2821 18.5245 21.7519 15.0021Z"/>';
      var THEME_ICON_LIGHT = '<path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12 3V5.25M18.364 5.63604L16.773 7.22703M21 12H18.75M18.364 18.364L16.773 16.773M12 18.75V21M7.22703 16.773L5.63604 18.364M5.25 12H3M7.22703 7.22703L5.63604 5.63604M15.75 12C15.75 14.0711 14.0711 15.75 12 15.75C9.92893 15.75 8.25 14.0711 8.25 12C8.25 9.92893 9.92893 8.25 12 8.25C14.0711 8.25 15.75 9.92893 15.75 12Z"/>';

      function applyTheme(theme) {
        var isDark = theme === 'dark';
        document.documentElement.classList.toggle('cds--g100', isDark);
        document.body.classList.toggle('cds--g100', isDark);
        var icon = document.getElementById('themeIcon');
        if (icon) icon.innerHTML = isDark ? THEME_ICON_DARK : THEME_ICON_LIGHT;
      }

      function toggleTheme() {
        var next = document.documentElement.classList.contains('cds--g100') ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        window.__theme = next;
        applyTheme(next);
      }

      document.addEventListener('DOMContentLoaded', function() {
        applyTheme(window.__theme || localStorage.getItem('theme') || 'light');
        var sideNav = document.querySelector('cds-side-nav');
        if (sideNav) {
          function updateLayout() {
            document.documentElement.classList.toggle('side-nav-expanded', !!sideNav.expanded);
          }

          updateLayout();

          var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
              if (mutation.attributeName === 'expanded') {
                updateLayout();
              }
            });
          });
          observer.observe(sideNav, { attributes: true });

          var originalExpanded = sideNav.expanded;
          Object.defineProperty(sideNav, '_expanded', {
            get: function() { return originalExpanded; },
            set: function(value) {
              originalExpanded = value;
              updateLayout();
            }
          });
        }
      });

      (function responsiveSideNav() {
        var BREAKPOINT = 1550;

        function apply() {
          var sideNav = document.querySelector('cds-side-nav');
          if (!sideNav) return;
          sideNav.expanded = window.innerWidth >= BREAKPOINT;
        }

        document.addEventListener('DOMContentLoaded', apply);

        var t;
        window.addEventListener('resize', function() {
          clearTimeout(t);
          t = setTimeout(apply, 1);
        });
      })();
    </script>
  </body>
</html>
