{@app.treasure.shared.util.Pager pager}
{#if pager.pageCount > 1}
<nav class="pager" aria-label="{m:pager.label}">
  {#if pager.prevUrl}
  <a class="btn btn-secondary btn-sm" href="{pager.prevUrl}" rel="prev">{m:pager.previous}</a>
  {#else}
  <span class="btn btn-secondary btn-sm is-disabled" aria-disabled="true">{m:pager.previous}</span>
  {/if}
  <span class="pager-status">{m:pager.status(pager.page, pager.pageCount)}</span>
  {#if pager.nextUrl}
  <a class="btn btn-secondary btn-sm" href="{pager.nextUrl}" rel="next">{m:pager.next}</a>
  {#else}
  <span class="btn btn-secondary btn-sm is-disabled" aria-disabled="true">{m:pager.next}</span>
  {/if}
</nav>
{/if}
