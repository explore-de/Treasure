<div class="flash-stack" id="flashStack" aria-live="polite">
{#if flash:success}
  <cds-inline-notification kind="success" title="{m:flash.success}" subtitle="{flash:success}" low-contrast></cds-inline-notification>
{/if}
{#if flash:error}
  <cds-inline-notification kind="error" title="{m:flash.error}" subtitle="{flash:error}" low-contrast></cds-inline-notification>
{/if}
{#if flash:warning}
  <cds-inline-notification kind="warning" title="{m:flash.warning}" subtitle="{flash:warning}" low-contrast></cds-inline-notification>
{/if}
{#if flash:info}
  <cds-inline-notification kind="info" title="{m:flash.info}" subtitle="{flash:info}" low-contrast></cds-inline-notification>
{/if}
</div>
