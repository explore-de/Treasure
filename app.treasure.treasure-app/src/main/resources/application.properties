########################################
# General
########################################
quarkus.banner.path=banner.txt
%prod.quarkus.management.enabled=true

########################################
# Database / Hibernate
########################################
quarkus.datasource.db-kind=postgresql

quarkus.hibernate-orm.schema-management.strategy=validate

# Flyway owns the schema; Hibernate only validates against it
quarkus.flyway.migrate-at-start=true
# Adopt existing (pre-Flyway) databases without failing on the non-empty schema
quarkus.flyway.baseline-on-migrate=true

########################################
# OIDC
########################################
quarkus.oidc.application-type=web-app
# The app only talks to the user through the ID token and never calls another
# API with the access token, so keep just the ID and refresh tokens in the
# session cookie. Entra tokens are large; this keeps the cookie under 4 KB.
quarkus.oidc.token-state-manager.strategy=id-refresh-tokens

# Stand: Microsoft Entra ID. The app registration needs a Web redirect URI of
# https://<host>/callback, a front-channel logout URL of https://<host>/,
# and App Roles with the values super_admin, admin and user assigned to people.
%prod.quarkus.oidc.provider=microsoft
%prod.quarkus.oidc.auth-server-url=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
%prod.quarkus.oidc.client-id=${ENTRA_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${ENTRA_CLIENT_SECRET}
%prod.quarkus.oidc.authentication.redirect-path=/callback
%prod.quarkus.oidc.authentication.restore-path-after-redirect=true
%prod.quarkus.oidc.roles.role-claim-path=roles
%prod.quarkus.oidc.token.principal-claim=preferred_username
# Key for the encrypted session cookie: at least 32 characters, the same on every instance.
%prod.quarkus.oidc.token-state-manager.encryption-secret=${OIDC_SESSION_SECRET}

# Dev and test only: a fixed key so the short Dev Services client secret does not trigger a warning.
%dev.quarkus.oidc.token-state-manager.encryption-secret=treasure-dev-session-secret-not-for-prod
%test.quarkus.oidc.token-state-manager.encryption-secret=treasure-dev-session-secret-not-for-prod

# Dev and test: Keycloak Dev Services with demo users

# DevServices configuration
quarkus.keycloak.devservices.realm-name=treasure
quarkus.keycloak.devservices.users.admin=password
quarkus.keycloak.devservices.users.maria=password
quarkus.keycloak.devservices.users.thomas=password
quarkus.keycloak.devservices.roles.admin=super_admin,admin,user
quarkus.keycloak.devservices.roles.maria=admin,user
quarkus.keycloak.devservices.roles.thomas=user

# Logout configuration
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.http.auth.permission.logout.paths=/logout
quarkus.http.auth.permission.logout.policy=authenticated

# Keycloak Admin Client (for programmatic user management)
# Dev Services will automatically configure the admin client

########################################
# Bootstrap Configuration (dev and test only)
########################################
treasure.bootstrap.enabled=false
%dev.treasure.bootstrap.enabled=true
%test.treasure.bootstrap.enabled=true


